name=CodonTraceSwarm
version=0.12.9
author=Parvaz Jamei
maintainer=Parvaz Jamei
sentence=Local typed message core with optional headers for common sensor libraries.
paragraph=C++11 codec for boards with at least 128 KB SRAM. Those headers call that sensor's own library and do not invent a reading. Examples were compile-tested, not flashed. AVR, megaAVR, SAMD21, UNO R4, ESP8266 and Due are excluded. Not Wi-Fi or MQTT.
depends=Adafruit BME280 Library,Adafruit SHT4x Library,Adafruit INA219,Adafruit_VL53L0X,HX711 Arduino Library,ProtoCentral FDC1004 Capacitive Sensor Library,FDCxCapSense
category=Communication
url=https://github.com/Parvaz-Jamei/CodonTraceSwarm
architectures=esp32,rp2040,mbed_nano,mbed_rp2040,mbed_portenta,mbed_giga,mbed_opta,renesas_portenta
includes=CodonTraceSwarm.h
