name: Arduino on Windows, Linux, and macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: arduino/arduino-lint-action@v2
        with:
          compliance: strict
          library-manager: submit
          project-path: .
  compile:
    # OS matrix only. The only FQBN is arduino:mbed_nano:nano33ble, not three board families.
    name: compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile examples for Nano 33 BLE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arduino-bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$RUNNER_TEMP/arduino-bin" sh
          export PATH="$RUNNER_TEMP/arduino-bin:$PATH"
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano
          arduino-cli lib update-index
          arduino-cli lib install \
            "Adafruit BME280 Library" \
            "Adafruit SHT4x Library" \
            "Adafruit INA219" \
            "Adafruit_VL53L0X" \
            "HX711 Arduino Library" \
            "ProtoCentral FDC1004 Capacitive Sensor Library" \
            "FDCxCapSense"
          rm -rf "$RUNNER_TEMP/sketches"
          cp -a examples "$RUNNER_TEMP/sketches"
          compiled=0
          for sketch in "$RUNNER_TEMP/sketches"/*; do
            if [[ -d "$sketch" ]]; then
              compiled=$((compiled + 1))
              arduino-cli compile --fqbn arduino:mbed_nano:nano33ble \
                --library "$GITHUB_WORKSPACE" "$sketch"
            fi
          done
          if [[ "$compiled" -lt 1 ]]; then
            echo "no example sketches found" >&2
            exit 1
          fi
