name: Arduino on Windows, Linux, and macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: arduino/arduino-lint-action@v2
        with:
          compliance: strict
          library-manager: submit
          project-path: .
  compile:
    name: compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile examples for Nano 33 BLE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arduino-bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$RUNNER_TEMP/arduino-bin" sh
          export PATH="$RUNNER_TEMP/arduino-bin:$PATH"
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano
          rm -rf "$RUNNER_TEMP/sketches"
          cp -a examples "$RUNNER_TEMP/sketches"
          for ex in CheckInclude CoreSmoke PortableClock; do
            arduino-cli compile --fqbn arduino:mbed_nano:nano33ble \
              --library "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sketches/$ex"
          done
