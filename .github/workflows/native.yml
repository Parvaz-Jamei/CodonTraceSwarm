name: Rebuild checkpoint verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    name: sanitized core + pinned host 74c7b3f
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch immutable host contract
        run: |
          git init reference-host
          git -C reference-host remote add origin https://github.com/Parvaz-Jamei/codontrace-genesis.git
          git -C reference-host fetch --depth 1 origin 74c7b3f15c2d093da03e392094814d63a4997c2c
          git -C reference-host checkout --detach FETCH_HEAD
      - name: Sanitized core and real-host checks
        run: python3 tools/check.py --sanitize --host reference-host
  genesis-main:
    # Loopback contract against the current Genesis main, not only the pin:
    # C++ (ASan/UBSan) encodes, Genesis main's codontrace.swarm decodes and
    # ingests, and host-generated commands are decoded by C++.
    name: loopback contract vs Genesis main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch Genesis main
        run: git clone --depth 1 --branch main https://github.com/Parvaz-Jamei/codontrace-genesis.git genesis-main
      - name: Contract checks against main
        run: |
          rev="$(git -C genesis-main rev-parse HEAD)"
          echo "Genesis main under test: $rev" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/check.py --sanitize --build-dir build-main --host genesis-main --host-rev "$rev"
  platformio-native:
    name: PlatformIO native + Unity (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PlatformIO Core
        run: python -m pip install "platformio==6.2.0"
      - name: Unity tests
        run: pio test -e native
      - name: library.json manifest packs
        run: pio pkg pack -o "$RUNNER_TEMP"
