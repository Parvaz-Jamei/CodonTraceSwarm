name: Rebuild checkpoint verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    name: sanitized core + reference host 74c7b3f
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch immutable host contract
        run: |
          git init reference-host
          git -C reference-host remote add origin https://github.com/Parvaz-Jamei/codontrace-genesis.git
          git -C reference-host fetch --depth 1 origin 74c7b3f15c2d093da03e392094814d63a4997c2c
          git -C reference-host checkout --detach FETCH_HEAD
      - name: Sanitized core and real-host checks
        run: python3 tools/check.py --sanitize --host reference-host --host-rev 74c7b3f15c2d093da03e392094814d63a4997c2c
      - name: Depth-64 check unit tests (stub decoders)
        run: python3 -m unittest -v tools/test_depth_check.py
      - name: Depth-64 check must fail against 74c7b3f, which accepts the envelope
        run: |
          set +e
          out=$(python3 tools/depth_check.py reference-host 2>&1); rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 1
          echo "$out" | grep -q '^FAIL: host accepted an envelope nested 64 arrays deep'
      - name: Negative control, verify_golden must fail against 74c7b3f
        run: |
          set +e
          out=$(python3 tools/verify_golden.py reference-host build-native 2>&1); rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 1
          echo "$out" | grep -q '^FAIL: host accepted an envelope nested 64 arrays deep'
  genesis-main:
    # Loopback contract against a pinned Genesis main commit (3e6686d, the
    # merge of PR #119 with the strict reading-value rules): C++ (ASan/UBSan) encodes, that commit's
    # codontrace.swarm decodes and ingests, and host-generated commands are
    # decoded by C++. Bump GENESIS_REV deliberately when Genesis main moves.
    name: loopback contract vs Genesis 3e6686d
    runs-on: ubuntu-24.04
    env:
      GENESIS_REV: 3e6686d72834221f3720fe54314aa84d2ea0ec05
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch Genesis at the pinned main commit
        run: |
          git init genesis-main
          git -C genesis-main remote add origin https://github.com/Parvaz-Jamei/codontrace-genesis.git
          git -C genesis-main fetch --depth 1 origin "$GENESIS_REV"
          git -C genesis-main checkout --detach FETCH_HEAD
      - name: Contract checks against the pinned commit
        run: |
          echo "Genesis under test: $GENESIS_REV" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/check.py --sanitize --build-dir build-main --host genesis-main --host-rev "$GENESIS_REV"
      - name: Shared golden fixtures and strict depth-64 case
        run: python3 tools/verify_golden.py genesis-main build-main
      - name: Vendored fixtures must be pinned to the same commit
        run: test "$(cat tests/golden/genesis_swarm/GENESIS_REV)" = "$GENESIS_REV"
      - name: Genesis swarm fixtures sha256-pinned, encoder frames, decode outcomes
        run: |
          (cd tests/golden/genesis_swarm && sha256sum -c --strict MANIFEST.sha256)
          python3 tools/verify_genesis_fixtures.py genesis-main build-main
  platformio-native:
    name: PlatformIO native + Unity (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install PlatformIO Core
        run: python -m pip install "platformio==6.2.0"
      - name: Unity tests
        run: pio test -e native
      - name: Zero-heap Unity suites (replaced malloc family, every operator new form)
        run: pio test -e native_noheap
      - name: No heap allocation symbols in library and header-adapter objects
        run: python3 tools/check_no_heap.py
      - name: library.json manifest packs
        run: pio pkg pack -o "$RUNNER_TEMP"
