; Host-native PlatformIO + Unity tests for the codec core, with ASan/UBSan.
; Embedded users do not need this file: library.json is the PlatformIO
; manifest. Run with: pio test -e native
[platformio]
src_dir = src
test_dir = tests/pio

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
; Arduino-only adapter headers are header-only; every .cpp in src/ is
; portable C++11 (the same list tools/check.py and CMakeLists.txt build).
build_src_filter = +<*.cpp> +<cts/*.cpp>
build_flags =
  -std=c++11
  -I tests
  -Wall -Wextra -Wpedantic -Werror
  -g
  -fsanitize=address,undefined,float-cast-overflow
  -fno-sanitize-recover=all
  -fno-omit-frame-pointer
test_ignore = test_no_heap_*
extra_scripts = pre:tools/pio_sanitize_link.py

; Zero-heap proof: the same library sources; the test binary defines the
; whole malloc family and every operator new/delete (tests/heap_counter.h),
; so libc- and libstdc++-internal allocations are counted too.
; C++17 only so the std::align_val_t operator new forms exist; the library
; itself is still C++11 (env:native). No sanitizers here: ASan's allocator
; would sit under the counted calls and add noise, not coverage.
[env:native_noheap]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
test_filter = test_no_heap_*
build_src_filter = +<*.cpp> +<cts/*.cpp>
build_flags =
  -std=c++17
  -I tests
  -I tests/fakes
  -Wall -Wextra -Wpedantic -Werror
  -g -O1
  -fno-builtin
