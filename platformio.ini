; Host-native PlatformIO + Unity tests for the codec core, with ASan/UBSan.
; Embedded users do not need this file: library.json is the PlatformIO
; manifest. Run with: pio test -e native
[platformio]
src_dir = src
test_dir = tests/pio

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
; Arduino-only adapter headers are header-only; every .cpp in src/ is
; portable C++11 (the same list tools/check.py and CMakeLists.txt build).
build_src_filter = +<*.cpp> +<cts/*.cpp>
build_flags =
  -std=c++11
  -I tests
  -Wall -Wextra -Wpedantic -Werror
  -g
  -fsanitize=address,undefined,float-cast-overflow
  -fno-sanitize-recover=all
  -fno-omit-frame-pointer
extra_scripts = pre:tools/pio_sanitize_link.py
